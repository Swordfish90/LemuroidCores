name: Build ARMSX2 Android core

on:
  workflow_dispatch:
  push:
    branches:
      - integration/armsx2-cores
    paths:
      - '.github/workflows/build-armsx2-android.yml'

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_ABI: arm64-v8a
      ANDROID_API: "28"
      ARMSX2_COMMIT: ba6892742e357085897d0a151bd8e40485dda968
    steps:
      - name: Checkout LemuroidCores
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git flex bison build-essential

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Checkout ARMSX2 source
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX2
          ref: ${{ env.ARMSX2_COMMIT }}
          path: armsx2
          submodules: recursive

      - name: Add 0.5x internal resolution option
        working-directory: armsx2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pcsx2-libretro/Main.cpp")
          source = path.read_text()
          old_options = '{{"1x", "1x (native)"}, {"2x", nullptr}, {"3x", nullptr}, {"4x", nullptr}, {nullptr, nullptr}}, "1x"},'
          new_options = '{{"0.5x", "0.5x (half native)"}, {"1x", "1x (native)"}, {"2x", nullptr}, {"3x", nullptr}, {"4x", nullptr}, {nullptr, nullptr}}, "1x"},'
          if source.count(old_options) != 1:
              raise SystemExit("Could not uniquely locate ARMSX2 resolution option list")
          source = source.replace(old_options, new_options, 1)
          old_legacy = '{"armsx2_upscale", "Internal resolution; 1x|2x|3x|4x"},'
          new_legacy = '{"armsx2_upscale", "Internal resolution; 0.5x|1x|2x|3x|4x"},'
          if source.count(old_legacy) != 1:
              raise SystemExit("Could not uniquely locate legacy ARMSX2 resolution option list")
          source = source.replace(old_legacy, new_legacy, 1)
          old_scale = 'static_cast<float>(std::clamp(atoi(var.value), 1, 4))'
          new_scale = 'std::clamp(std::strtof(var.value, nullptr), 0.5f, 4.0f)'
          if source.count(old_scale) != 1:
              raise SystemExit("Could not uniquely locate ARMSX2 resolution parser")
          source = source.replace(old_scale, new_scale, 1)
          path.write_text(source)
          print("Added 0.5x option and float parsing to both libretro option APIs.")
          PY

      - name: Build Android dependencies
        working-directory: armsx2
        run: |
          chmod +x .github/workflows/scripts/android/build-dependencies.sh
          ./.github/workflows/scripts/android/build-dependencies.sh "$GITHUB_WORKSPACE/armsx2-deps"

      - name: Configure ARMSX2 libretro core
        working-directory: armsx2
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-$ANDROID_API" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/armsx2-deps" \
            -DCMAKE_FIND_ROOT_PATH="$GITHUB_WORKSPACE/armsx2-deps" \
            -DENABLE_LIBRETRO=ON \
            -DENABLE_QT_UI=OFF \
            -DENABLE_SDL_FRONTEND=OFF \
            -DENABLE_GSRUNNER=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_RECOMPILER_TEST_HOOKS=OFF \
            -DENABLE_SETCAP=OFF \
            -DUSE_BACKTRACE=OFF \
            -DUSE_OPENGL=ON \
            -DUSE_VULKAN=OFF \
            -DX11_API=OFF \
            -DWAYLAND_API=OFF \
            -DDISABLE_ADVANCE_SIMD=TRUE \
            -DARMSX2_ANDROID_HOST_PAGE_SIZE=0x1000 \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Build ARM64 core
        working-directory: armsx2
        run: cmake --build build-android --target armsx2_libretro --parallel 2

      - name: Verify core artifact
        run: |
          CORE_PATH="$(find armsx2/build-android -type f -name armsx2_libretro.so -print -quit)"
          test -n "$CORE_PATH"
          test -s "$CORE_PATH"
          file "$CORE_PATH"
          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$CORE_PATH"
          mkdir -p dist/arm64-v8a
          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$CORE_PATH"
          test "$(stat -c%s "$CORE_PATH")" -lt 100000000
          cp "$CORE_PATH" dist/arm64-v8a/armsx2_libretro.so

      - name: Upload ARM64 core artifact
        uses: actions/upload-artifact@v4
        with:
          name: armsx2-libretro-android-arm64-v8a
          path: dist/arm64-v8a/armsx2_libretro.so
          if-no-files-found: error

      - name: Publish stripped core into bundled-cores
        run: |
          install -D dist/arm64-v8a/armsx2_libretro.so bundled-cores/src/main/jniLibs/arm64-v8a/libarmsx2_libretro_android.so
          install -D dist/arm64-v8a/armsx2_libretro.so lemuroid_core_armsx2/src/main/jniLibs/arm64-v8a/libarmsx2_libretro_android.so
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundled-cores/src/main/jniLibs/arm64-v8a/libarmsx2_libretro_android.so
          git add lemuroid_core_armsx2/src/main/jniLibs/arm64-v8a/libarmsx2_libretro_android.so
          if ! git diff --cached --quiet; then
            git commit -m "Add stripped ARMSX2 Android ARM64 core and feature module"
            git push origin HEAD:integration/armsx2-cores
          fi
